<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>MR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7fb;
    color:#202020;
}

button{
    border:0;
    background:none;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    position:relative;
    padding-bottom:76px;
}

/* =========================
   TOP
========================= */

.top{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#fff;
    position:sticky;
    top:0;
    z-index:50;
}

.tabs{
    display:flex;
    gap:24px;
    align-items:center;
}

.tab{
    font-size:16px;
    color:#777;
    font-weight:600;
    position:relative;
    padding:18px 0 15px;
}

.tab.active{
    color:#222;
}

.tab.active:after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:7px;
    width:22px;
    height:3px;
    border-radius:5px;
    background:#ff4f8b;
}

.top-actions{
    display:flex;
    gap:13px;
}

.icon-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

/* =========================
   BANNER
========================= */

.banner{
    margin:6px 12px 14px;
    height:142px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(110deg,#ff5a9d,#ff9b57,#ffd05c);
}

.banner:before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    right:-50px;
    top:-50px;
}

.banner-content{
    position:relative;
    z-index:2;
    padding:23px 20px;
    color:#fff;
}

.banner-small{
    font-size:12px;
    opacity:.95;
    margin-bottom:7px;
}

.banner-title{
    font-size:25px;
    font-weight:800;
    margin-bottom:7px;
}

.banner-text{
    font-size:13px;
    opacity:.95;
}

.banner-btn{
    display:inline-block;
    margin-top:12px;
    background:#fff;
    color:#ff4f82;
    padding:7px 16px;
    border-radius:18px;
    font-size:12px;
    font-weight:bold;
}

/* =========================
   RANKING
========================= */

.rank-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:0 12px 16px;
}

.rank-card{
    border-radius:13px;
    padding:12px 7px;
    text-align:center;
    background:#fff5f8;
}

.rank-icon{
    font-size:25px;
    margin-bottom:5px;
}

.rank-title{
    font-size:12px;
    font-weight:700;
}

.rank-sub{
    font-size:10px;
    color:#999;
    margin-top:3px;
}

/* =========================
   SECTION
========================= */

.section{
    padding:0 12px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.section-title{
    font-size:18px;
    font-weight:800;
}

.section-more{
    color:#999;
    font-size:12px;
}

/* =========================
   ROOM CARD
========================= */

.rooms{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.room{
    background:#fff;
    border:1px solid #f0f0f0;
    border-radius:13px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:0 2px 10px rgba(0,0,0,.035);
}

.room-avatar{
    width:60px;
    height:60px;
    flex-shrink:0;
    border-radius:12px;
    object-fit:cover;
    background:#eee;
}

.room-info{
    min-width:0;
    flex:1;
}

.room-name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.room-id{
    color:#999;
    font-size:10px;
    margin-top:3px;
}

.room-owner{
    font-size:11px;
    color:#777;
    margin-top:5px;
}

.room-bottom{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:5px;
}

.country{
    font-size:13px;
}

.users{
    color:#999;
    font-size:10px;
}

.room-actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.gift{
    font-size:22px;
}

.follow-btn{
    font-size:11px;
    color:#ff4f87;
    border:1px solid #ff4f87;
    border-radius:14px;
    padding:4px 9px;
}

.follow-btn.followed{
    color:#fff;
    background:#ff4f87;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:45px 15px;
    color:#aaa;
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

.empty-text{
    font-size:14px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:520px;
    height:72px;
    background:#fff;
    border-top:1px solid #eee;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#999;
    font-size:10px;
}

.nav-icon{
    font-size:22px;
}

.nav-item.active{
    color:#ff4f87;
}

/* =========================
   MODALS
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
}

.overlay.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:22px 22px 0 0;
    padding:18px;
    max-height:85vh;
    overflow:auto;
}

.sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.sheet-title{
    font-size:19px;
    font-weight:800;
}

.close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#f4f4f4;
    font-size:18px;
}

.search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:#f5f5f7;
    border-radius:14px;
    padding:11px 13px;
    margin-bottom:15px;
}

.search-box input{
    border:0;
    outline:none;
    background:none;
    width:100%;
    font-size:14px;
}

.search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.search-result img{
    width:50px;
    height:50px;
    border-radius:11px;
    object-fit:cover;
}

.search-info{
    flex:1;
}

.search-name{
    font-weight:bold;
    font-size:14px;
}

.search-id{
    color:#999;
    font-size:10px;
    margin-top:3px;
}

/* =========================
   ROOM SCREEN
========================= */

.room-screen{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%,#57377b,#171527 45%,#0d0d15);
    color:white;
    display:none;
    z-index:300;
    overflow:hidden;
}

.room-screen.show{
    display:block;
}

.room-top{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
}

.room-top-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.back{
    font-size:26px;
}

.room-title-live{
    font-size:15px;
    font-weight:700;
}

.room-online{
    color:#bbb;
    font-size:10px;
}

.room-main{
    padding:10px 14px;
}

.host{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
}

.host img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ff78a8;
}

.host-name{
    font-size:14px;
    font-weight:bold;
}

.host-id{
    color:#aaa;
    font-size:10px;
    margin-top:3px;
}

.seats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px 8px;
    margin-top:25px;
}

.seat{
    text-align:center;
}

.seat-avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#29263a;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    overflow:hidden;
}

.seat-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.seat-name{
    margin-top:5px;
    color:#ddd;
    font-size:9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.room-bottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:12px 14px 20px;
    background:linear-gradient(transparent,rgba(0,0,0,.65));
}

.chat-area{
    height:95px;
    overflow:hidden;
    margin-bottom:8px;
}

.chat-line{
    font-size:11px;
    margin:7px 0;
    color:#eee;
}

.chat-line b{
    color:#ff9abc;
}

.room-controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:10px;
}

.room-control{
    height:48px;
    border-radius:25px;
    background:rgba(255,255,255,.13);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.room-control span{
    font-size:10px;
    margin-left:4px;
}

.mic-on{
    background:#ff4f87;
}

/* =========================
   CREATE ROOM
========================= */

.create-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.create-option{
    padding:20px 10px;
    border-radius:14px;
    background:#fff5f8;
    text-align:center;
}

.create-option div:first-child{
    font-size:30px;
    margin-bottom:8px;
}

.create-option strong{
    font-size:13px;
}

</style>
</head>

<body>

<div class="app">

    <!-- TOP -->
    <header class="top">

        <div class="tabs">

            <button class="tab active"
                    onclick="changeTab('popular',this)">
                Popular
            </button>

            <button class="tab"
                    onclick="changeTab('following',this)">
                Following
            </button>

            <button class="tab"
                    onclick="changeTab('recent',this)">
                Recent
            </button>

        </div>

        <div class="top-actions">

            <button class="icon-btn"
                    onclick="openSearch()">
                🔍
            </button>

            <button class="icon-btn"
                    onclick="openCreate()">
                ＋
            </button>

        </div>

    </header>


    <!-- BANNER -->
    <section class="banner">

        <div class="banner-content">

            <div class="banner-small">
                MR VOICE PARTY
            </div>

            <div class="banner-title">
                Meet New Friends
            </div>

            <div class="banner-text">
                Talk • Sing • Play • Have Fun
            </div>

            <button class="banner-btn"
                    onclick="showToast('Welcome to MR')">
                Join Now
            </button>

        </div>

    </section>


    <!-- RANKING -->
    <section class="rank-grid">

        <button class="rank-card"
                onclick="showToast('Contribution Ranking')">
            <div class="rank-icon">🏆</div>
            <div class="rank-title">Contribution</div>
            <div class="rank-sub">Ranking</div>
        </button>

        <button class="rank-card"
                onclick="showToast('Charm Ranking')">
            <div class="rank-icon">💎</div>
            <div class="rank-title">Charm Ranking</div>
            <div class="rank-sub">Ranking</div>
        </button>

        <button class="rank-card"
                onclick="showToast('Room Ranking')">
            <div class="rank-icon">👑</div>
            <div class="rank-title">Room Ranking</div>
            <div class="rank-sub">Ranking</div>
        </button>

    </section>


    <!-- ROOMS -->
    <section class="section">

        <div class="section-head">

            <div class="section-title"
                 id="roomSectionTitle">
                Popular Rooms
            </div>

            <button class="section-more"
                    onclick="openSearch()">
                More ›
            </button>

        </div>

        <div class="rooms" id="rooms"></div>

    </section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button class="nav-item active"
            onclick="navHome(this)">
        <div class="nav-icon">⌂</div>
        <div>Home</div>
    </button>

    <button class="nav-item"
            onclick="showToast('Discover')">
        <div class="nav-icon">◎</div>
        <div>Discover</div>
    </button>

    <button class="nav-item"
            onclick="openCreate()">
        <div class="nav-icon">🎙</div>
        <div>Voice</div>
    </button>

    <button class="nav-item"
            onclick="showToast('Messages')">
        <div class="nav-icon">💬</div>
        <div>Message</div>
    </button>

    <button class="nav-item"
            onclick="showToast('Profile')">
        <div class="nav-icon">👤</div>
        <div>Profile</div>
    </button>

</nav>


<!-- SEARCH -->

<div class="overlay" id="searchOverlay">

    <div class="sheet">

        <div class="sheet-head">

            <div class="sheet-title">
                Search
            </div>

            <button class="close"
                    onclick="closeSearch()">
                ×
            </button>

        </div>

        <div class="search-box">

            🔍

            <input
                id="searchInput"
                type="text"
                placeholder="Search room or room ID..."
                oninput="searchRooms(this.value)"
            >

        </div>

        <div id="searchResults"></div>

    </div>

</div>


<!-- CREATE -->

<div class="overlay" id="createOverlay">

    <div class="sheet">

        <div class="sheet-head">

            <div class="sheet-title">
                Create Room
            </div>

            <button class="close"
                    onclick="closeCreate()">
                ×
            </button>

        </div>

        <div class="create-options">

            <button class="create-option"
                    onclick="createRoom('Voice Room')">

                <div>🎙</div>
                <strong>Voice Room</strong>

            </button>

            <button class="create-option"
                    onclick="createRoom('Music Room')">

                <div>🎵</div>
                <strong>Music Room</strong>

            </button>

            <button class="create-option"
                    onclick="createRoom('Game Room')">

                <div>🎮</div>
                <strong>Game Room</strong>

            </button>

            <button class="create-option"
                    onclick="createRoom('Party Room')">

                <div>🎉</div>
                <strong>Party Room</strong>

            </button>

        </div>

    </div>

</div>


<!-- REAL ROOM UI -->

<div class="room-screen"
     id="roomScreen">

    <div class="room-top">

        <div class="room-top-left">

            <button class="back"
                    onclick="leaveRoom()">
                ‹
            </button>

            <div>

                <div class="room-title-live"
                     id="liveRoomName">
                    MR Room
                </div>

                <div class="room-online"
                     id="liveRoomUsers">
                    0 people
                </div>

            </div>

        </div>

        <button onclick="showToast('Room shared')">
            ↗
        </button>

    </div>


    <div class="room-main">

        <div class="host">

            <img id="hostAvatar"
                 src="https://i.pravatar.cc/150?img=12">

            <div>

                <div class="host-name"
                     id="hostName">
                    Room Owner
                </div>

                <div class="host-id"
                     id="hostId">
                    MR00000
                </div>

            </div>

        </div>


        <div class="seats"
             id="seats"></div>

    </div>


    <div class="room-bottom">

        <div class="chat-area"
             id="chatArea">

            <div class="chat-line">
                <b>MR System:</b>
                Welcome to the room
            </div>

            <div class="chat-line">
                <b>Everyone:</b>
                Have fun 🎉
            </div>

        </div>

        <div class="room-controls">

            <button class="room-control"
                    id="micButton"
                    onclick="toggleMic()">
                🎙
            </button>

            <button class="room-control"
                    onclick="showToast('Chat')">
                💬
            </button>

            <button class="room-control"
                    onclick="sendGift()">
                🎁
            </button>

            <button class="room-control"
                    onclick="leaveRoom()">
                🚪
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   POPULAR ROOMS
   These are fixed.
   Popular does NOT automatically become Following/Recent.
===================================================== */

const popularRooms = [

    {
        id:"MR10001",
        owner:"RAKOB+FULL",
        name:"RAKOB+FULL",
        country:"🇲🇾",
        users:16,
        photo:"https://i.pravatar.cc/150?img=12",
        gift:"🚀"
    },

    {
        id:"MR10002",
        owner:"মানুষ বড় বেইমান",
        name:"মানুষ বড় বেইমান",
        country:"🇧🇩",
        users:19,
        photo:"https://i.pravatar.cc/150?img=32",
        gift:"🚀"
    },

    {
        id:"MR10003",
        owner:"Ms Asif",
        name:"ভালোবাসার মানুষ",
        country:"🇧🇩",
        users:4,
        photo:"https://i.pravatar.cc/150?img=47",
        gift:"🚀"
    },

    {
        id:"MR10004",
        owner:"Imran SK",
        name:"IMRAN SK",
        country:"🇮🇳",
        users:4,
        photo:"https://i.pravatar.cc/150?img=51",
        gift:"🚀"
    },

    {
        id:"MR10005",
        owner:"MR Hridoy",
        name:"MR Hridoy",
        country:"🇦🇪",
        users:2,
        photo:"https://i.pravatar.cc/150?img=13",
        gift:"🚀"
    },

    {
        id:"MR10006",
        owner:"Mafiya",
        name:"প্রেম নগর হাইস",
        country:"🇸🇦",
        users:6,
        photo:"https://i.pravatar.cc/150?img=44",
        gift:"🚀"
    },

    {
        id:"MR10007",
        owner:"New World",
        name:"সবাই আসুন",
        country:"🇧🇩",
        users:8,
        photo:"https://i.pravatar.cc/150?img=25",
        gift:"🎁"
    },

    {
        id:"MR10008",
        owner:"Feel",
        name:"Feel Room",
        country:"🇦🇪",
        users:12,
        photo:"https://i.pravatar.cc/150?img=36",
        gift:"🚀"
    }

];


/* =====================================================
   FOLLOWING + RECENT
   Start EMPTY.
===================================================== */

let followingIds =
    JSON.parse(
        localStorage.getItem("mrchat_following") || "[]"
    );

let recentIds =
    JSON.parse(
        localStorage.getItem("mrchat_recent") || "[]"
    );


let currentTab = "popular";
let currentRoom = null;


/* =====================================================
   SAVE
===================================================== */

function saveFollowing(){

    localStorage.setItem(
        "mrchat_following",
        JSON.stringify(followingIds)
    );

}


function saveRecent(){

    localStorage.setItem(
        "mrchat_recent",
        JSON.stringify(recentIds)
    );

}


/* =====================================================
   ALL ROOMS
===================================================== */

function getAllRooms(){

    return [...popularRooms];

}


/* =====================================================
   FIND ROOM
===================================================== */

function findRoom(id){

    return getAllRooms().find(
        room => room.id === id
    );

}


/* =====================================================
   FOLLOWING
===================================================== */

function getFollowingRooms(){

    return followingIds
        .map(id => findRoom(id))
        .filter(Boolean);

}


/* =====================================================
   RECENT
===================================================== */

function getRecentRooms(){

    return recentIds
        .map(id => findRoom(id))
        .filter(Boolean);

}


/* =====================================================
   CHANGE TAB
===================================================== */

function changeTab(tab, element){

    currentTab = tab;

    document
        .querySelectorAll(".tab")
        .forEach(btn => btn.classList.remove("active"));

    element.classList.add("active");

    renderRooms();

}


/* =====================================================
   GET ROOMS
===================================================== */

function getRoomsForCurrentTab(){

    if(currentTab === "popular"){

        return popularRooms;

    }

    if(currentTab === "following"){

        return getFollowingRooms();

    }

    if(currentTab === "recent"){

        return getRecentRooms();

    }

    return [];

}


/* =====================================================
   RENDER
===================================================== */

function renderRooms(){

    const container =
        document.getElementById("rooms");

    const title =
        document.getElementById("roomSectionTitle");

    let rooms =
        getRoomsForCurrentTab();


    if(currentTab === "popular"){
        title.innerText = "Popular Rooms";
    }

    if(currentTab === "following"){
        title.innerText = "Following";
    }

    if(currentTab === "recent"){
        title.innerText = "Recent";
    }


    if(!rooms.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ${currentTab === "following" ? "♡" : "🕘"}
                </div>

                <div class="empty-text">

                    ${
                        currentTab === "following"
                        ? "You are not following any room yet."
                        : "You haven't entered any room yet."
                    }

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML =
        rooms.map(room => roomHTML(room)).join("");

}


/* =====================================================
   ROOM HTML
===================================================== */

function roomHTML(room){

    const followed =
        followingIds.includes(room.id);

    return `

        <div class="room"
             onclick="enterRoom('${room.id}')">

            <img
                class="room-avatar"
                src="${room.photo}"
                alt=""
            >

            <div class="room-info">

                <div class="room-name">
                    ${escapeHTML(room.name)}
                </div>

                <div class="room-id">
                    ID: ${room.id}
                </div>

                <div class="room-owner">
                    ${escapeHTML(room.owner)}
                </div>

                <div class="room-bottom">

                    <span class="country">
                        ${room.country}
                    </span>

                    <span class="users">
                        👥 ${room.users}
                    </span>

                </div>

            </div>

            <div class="room-actions"
                 onclick="event.stopPropagation()">

                <div class="gift">
                    ${room.gift}
                </div>

                <button
                    class="follow-btn ${followed ? "followed" : ""}"
                    onclick="toggleFollow('${room.id}')">

                    ${followed ? "Following" : "Follow"}

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   FOLLOW / UNFOLLOW
===================================================== */

function toggleFollow(id){

    if(followingIds.includes(id)){

        followingIds =
            followingIds.filter(
                roomId => roomId !== id
            );

        showToast("Unfollowed");

    }else{

        followingIds.unshift(id);

        showToast("Following");

    }

    saveFollowing();

    renderRooms();

}


/* =====================================================
   ENTER ROOM
   Automatically adds to Recent.
   Duplicate removed.
===================================================== */

function enterRoom(id){

    const room =
        findRoom(id);

    if(!room) return;


    recentIds =
        recentIds.filter(
            roomId => roomId !== id
        );


    recentIds.unshift(id);


    /* Keep maximum 30 recent rooms */

    recentIds =
        recentIds.slice(0,30);

    saveRecent();


    openRoom(room);

}


/* =====================================================
   OPEN REAL ROOM UI
===================================================== */

function openRoom(room){

    currentRoom = room;

    document.getElementById("liveRoomName")
        .innerText = room.name;

    document.getElementById("liveRoomUsers")
        .innerText = room.users + " people";

    document.getElementById("hostName")
        .innerText = room.owner;

    document.getElementById("hostId")
        .innerText = room.id;

    document.getElementById("hostAvatar")
        .src = room.photo;


    createSeats(room);


    document
        .getElementById("roomScreen")
        .classList.add("show");

}


/* =====================================================
   ROOM SEATS
===================================================== */

function createSeats(room){

    const seats =
        document.getElementById("seats");

    let html = "";

    const count =
        Math.min(Math.max(room.users,1),15);


    for(let i=0;i<count;i++){

        const avatar =
            "https://i.pravatar.cc/150?img=" +
            ((i+3)%70 + 1);

        html += `

            <div class="seat">

                <div class="seat-avatar">

                    <img
                        src="${avatar}"
                        alt=""
                    >

                </div>

                <div class="seat-name">

                    ${
                        i === 0
                        ? room.owner
                        : "User " + (i+1)
                    }

                </div>

            </div>

        `;

    }


    seats.innerHTML = html;

}


/* =====================================================
   LEAVE ROOM
===================================================== */

function leaveRoom(){

    document
        .getElementById("roomScreen")
        .classList.remove("show");

    currentRoom = null;

    renderRooms();

}


/* =====================================================
   MIC
===================================================== */

let micOn = false;

function toggleMic(){

    micOn = !micOn;

    const button =
        document.getElementById("micButton");

    if(micOn){

        button.classList.add("mic-on");

        showToast("Microphone ON");

    }else{

        button.classList.remove("mic-on");

        showToast("Microphone OFF");

    }

}


/* =====================================================
   GIFT
===================================================== */

function sendGift(){

    if(!currentRoom) return;

    showToast("🎁 Gift sent to " + currentRoom.owner);

}


/* =====================================================
   SEARCH
===================================================== */

function openSearch(){

    document
        .getElementById("searchOverlay")
        .classList.add("show");

    document
        .getElementById("searchInput")
        .focus();

    searchRooms("");

}


function closeSearch(){

    document
        .getElementById("searchOverlay")
        .classList.remove("show");

}


function searchRooms(value){

    value =
        value.trim().toLowerCase();


    /*
      Search combines Popular,
      Following and Recent,
      but duplicates are removed.
    */

    const map = new Map();


    popularRooms.forEach(
        room => map.set(room.id,room)
    );


    getFollowingRooms().forEach(
        room => map.set(room.id,room)
    );


    getRecentRooms().forEach(
        room => map.set(room.id,room)
    );


    let rooms =
        [...map.values()];


    if(value){

        rooms =
            rooms.filter(room =>

                room.name.toLowerCase()
                    .includes(value)

                ||

                room.owner.toLowerCase()
                    .includes(value)

                ||

                room.id.toLowerCase()
                    .includes(value)

            );

    }


    const result =
        document.getElementById("searchResults");


    if(!rooms.length){

        result.innerHTML = `

            <div class="empty">
                No room found
            </div>

        `;

        return;

    }


    result.innerHTML =
        rooms.map(room => `

            <div
                class="search-result"
                onclick="searchEnter('${room.id}')">

                <img
                    src="${room.photo}"
                    alt=""
                >

                <div class="search-info">

                    <div class="search-name">
                        ${escapeHTML(room.name)}
                    </div>

                    <div class="search-id">
                        ${room.id} • 👥 ${room.users}
                    </div>

                </div>

                <div>
                    ${room.country}
                </div>

            </div>

        `).join("");

}


function searchEnter(id){

    closeSearch();

    enterRoom(id);

}


/* =====================================================
   CREATE ROOM
===================================================== */

function openCreate(){

    document
        .getElementById("createOverlay")
        .classList.add("show");

}


function closeCreate(){

    document
        .getElementById("createOverlay")
        .classList.remove("show");

}


function createRoom(type){

    closeCreate();

    showToast(type + " creation will be connected to server.");

}


/* =====================================================
   NAV HOME
===================================================== */

function navHome(button){

    document
        .querySelectorAll(".nav-item")
        .forEach(
            item => item.classList.remove("active")
        );

    button.classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    let toast =
        document.getElementById("toast");


    if(!toast){

        toast =
            document.createElement("div");

        toast.id = "toast";

        toast.style.position = "fixed";
        toast.style.left = "50%";
        toast.style.bottom = "90px";
        toast.style.transform = "translateX(-50%)";
        toast.style.background = "rgba(0,0,0,.82)";
        toast.style.color = "#fff";
        toast.style.padding = "10px 17px";
        toast.style.borderRadius = "20px";
        toast.style.fontSize = "12px";
        toast.style.zIndex = "9999";

        document.body.appendChild(toast);

    }


    toast.innerText = message;

    toast.style.display = "block";


    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.style.display = "none";

        },1800);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   INITIAL LOAD
===================================================== */

renderRooms();

</script>

</body>
</html>
