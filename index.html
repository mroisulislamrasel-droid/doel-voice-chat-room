<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f9;
    color:#222;
    max-width:430px;
    margin:auto;
    min-height:100vh;
}

button{
    border:0;
    background:none;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   HOME TOP
========================= */

.home-top{
    height:58px;
    background:#fff;
    display:flex;
    align-items:center;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:50;
}

.tabs{
    display:flex;
    gap:25px;
    height:100%;
    align-items:center;
}

.tab{
    font-size:15px;
    color:#999;
    font-weight:600;
    height:100%;
    display:flex;
    align-items:center;
    position:relative;
}

.tab.active{
    color:#222;
}

.tab.active:after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:3px;
    border-radius:3px;
    background:#ff4d88;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.circle-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#f3f3f6;
    font-size:19px;
}

.add-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#ff4d88;
    color:white;
    font-size:25px;
}

/* =========================
   BANNER
========================= */

.banner{
    margin:12px;
    height:145px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:linear-gradient(135deg,#ff5b91,#8c5cff);
    color:#fff;
}

.banner-content{
    padding:22px;
}

.banner h2{
    font-size:24px;
    margin-bottom:8px;
}

.banner p{
    font-size:13px;
    opacity:.9;
}

.banner-btn{
    margin-top:15px;
    padding:8px 17px;
    border-radius:18px;
    background:#fff;
    color:#ff4d88;
    font-weight:bold;
    font-size:12px;
}

.banner-dots{
    position:absolute;
    bottom:11px;
    left:20px;
    display:flex;
    gap:5px;
}

.banner-dot{
    width:6px;
    height:6px;
    border-radius:6px;
    background:#ffffff80;
}

.banner-dot.active{
    width:18px;
    background:#fff;
}

/* =========================
   ROOM CATEGORY
========================= */

.category-title{
    font-size:18px;
    font-weight:bold;
    padding:8px 14px;
}

.category-scroll{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 14px 13px;
}

.category-scroll::-webkit-scrollbar{
    display:none;
}

.category{
    min-width:84px;
    text-align:center;
}

.category-icon{
    width:64px;
    height:64px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    background:#fff;
    box-shadow:0 3px 12px #0000000b;
}

.category-name{
    font-size:11px;
    margin-top:6px;
    color:#555;
}

/* =========================
   ROOM LIST
========================= */

.list-title{
    padding:8px 14px;
    font-size:18px;
    font-weight:bold;
}

.rooms{
    padding:0 12px 90px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.room{
    background:#fff;
    border-radius:15px;
    padding:11px;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:0 2px 10px #00000008;
}

.room-cover{
    width:61px;
    height:61px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    background:linear-gradient(135deg,#ffd6e5,#eadcff);
    flex-shrink:0;
}

.room-info{
    flex:1;
    min-width:0;
}

.room-name{
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.room-owner{
    font-size:11px;
    color:#999;
    margin-top:5px;
}

.room-meta{
    font-size:11px;
    color:#777;
    margin-top:5px;
}

.room-users{
    text-align:center;
    color:#888;
    font-size:11px;
}

.room-users strong{
    display:block;
    color:#444;
    font-size:13px;
}

/* =========================
   EMPTY
========================= */

.empty{
    margin:15px 0;
    padding:45px 20px;
    background:#fff;
    border-radius:18px;
    text-align:center;
    color:#999;
}

.empty-icon{
    font-size:40px;
    margin-bottom:12px;
}

.empty h3{
    color:#444;
    margin-bottom:7px;
}

/* =========================
   BOTTOM
========================= */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    max-width:430px;
    width:100%;
    height:68px;
    background:#fff;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:60;
}

.nav{
    text-align:center;
    color:#999;
    font-size:10px;
}

.nav-icon{
    font-size:21px;
    display:block;
    margin-bottom:3px;
}

.nav.active{
    color:#ff4d88;
}

/* =========================
   ROOM PAGE
========================= */

.room-page{
    position:fixed;
    inset:0;
    max-width:430px;
    margin:auto;
    background:
      radial-gradient(circle at 20% 10%,#47335f,#171526 45%),
      #171526;
    color:#fff;
    z-index:200;
    display:none;
}

.room-page.show{
    display:block;
}

.room-header{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:10px;
}

.room-back{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#ffffff18;
    color:#fff;
    font-size:23px;
}

.room-header-info{
    flex:1;
    min-width:0;
}

.room-header-name{
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.room-header-id{
    font-size:10px;
    color:#aaa;
    margin-top:3px;
}

.room-header-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#ffffff15;
    color:#fff;
    font-size:18px;
}

/* ROOM NOTICE */

.room-announcement{
    margin:5px 12px;
    padding:9px 12px;
    background:#ffffff0c;
    border-radius:12px;
    font-size:11px;
    color:#ccc;
}

/* HOST */

.host{
    text-align:center;
    margin-top:15px;
}

.host-avatar{
    width:72px;
    height:72px;
    border-radius:50%;
    margin:auto;
    background:linear-gradient(135deg,#ff77a8,#8e65ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    border:3px solid #ffffff30;
}

.host-name{
    margin-top:7px;
    font-size:12px;
    font-weight:bold;
}

.host-tag{
    display:inline-block;
    margin-top:4px;
    background:#ffb300;
    color:#321f00;
    border-radius:10px;
    padding:3px 8px;
    font-size:9px;
}

/* SEATS */

.seats{
    margin-top:17px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:19px 6px;
    padding:0 12px;
}

.seat{
    text-align:center;
}

.seat-avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    background:linear-gradient(135deg,#ffca8a,#ff80a8);
    position:relative;
    border:2px solid #ffffff22;
}

.seat-mic{
    position:absolute;
    right:-3px;
    bottom:-3px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#45c96b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

.seat-name{
    margin-top:6px;
    font-size:10px;
    color:#ddd;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* CHAT */

.chat{
    position:absolute;
    left:0;
    right:0;
    bottom:75px;
    height:175px;
    padding:10px 13px;
    overflow-y:auto;
}

.chat-line{
    margin:7px 0;
    font-size:12px;
    color:#ddd;
}

.chat-line b{
    color:#ffb3cd;
}

/* GIFT PANEL */

.gift-panel{
    position:absolute;
    bottom:75px;
    left:10px;
    right:10px;
    padding:13px;
    border-radius:18px;
    background:#29263e;
    display:none;
}

.gift-panel.show{
    display:block;
}

.gifts{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.gift{
    padding:10px 5px;
    background:#ffffff0b;
    border-radius:12px;
    color:#fff;
}

.gift div{
    font-size:27px;
}

.gift small{
    font-size:9px;
    color:#bbb;
}

/* ROOM FOOTER */

.room-footer{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:75px;
    background:#11101b;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
}

.room-action{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#ffffff12;
    color:#fff;
    font-size:19px;
    flex-shrink:0;
}

.room-action.on{
    background:#fff;
    color:#222;
}

.room-input{
    flex:1;
    height:42px;
    border:0;
    outline:none;
    border-radius:22px;
    background:#ffffff0d;
    color:#fff;
    padding:0 14px;
}

.room-input::placeholder{
    color:#888;
}

.gift-action{
    background:linear-gradient(135deg,#ff4385,#ff9d43);
}

/* =========================
   SEARCH
========================= */

.search-page{
    position:fixed;
    inset:0;
    max-width:430px;
    margin:auto;
    background:#f7f7f9;
    z-index:100;
    display:none;
}

.search-page.show{
    display:block;
}

.search-top{
    height:60px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 12px;
}

.search-back{
    font-size:26px;
}

.search-input{
    flex:1;
    height:40px;
    border:0;
    outline:none;
    background:#f1f1f4;
    border-radius:21px;
    padding:0 15px;
}

.search-results{
    padding:12px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:10px 17px;
    border-radius:20px;
    font-size:12px;
    z-index:500;
    display:none;
}
</style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home">

    <div class="home-top">

        <div class="tabs">

            <button class="tab"
                onclick="setTab('following',this)">
                Following
            </button>

            <button class="tab active"
                onclick="setTab('popular',this)">
                Popular
            </button>

            <button class="tab"
                onclick="setTab('recent',this)">
                Recent
            </button>

        </div>

        <div class="top-actions">

            <button class="circle-btn"
                onclick="openSearch()">
                🔍
            </button>

            <button class="add-btn"
                onclick="createRoom()">
                +
            </button>

        </div>

    </div>


    <!-- BANNER -->

    <div class="banner">

        <div class="banner-content">

            <h2>MR Party</h2>

            <p>
                Talk, meet friends and enjoy voice rooms.
            </p>

            <button class="banner-btn"
                onclick="showToast('Welcome to MR')">
                Join Now
            </button>

        </div>

        <div class="banner-dots">
            <span class="banner-dot active"></span>
            <span class="banner-dot"></span>
            <span class="banner-dot"></span>
            <span class="banner-dot"></span>
        </div>

    </div>


    <!-- ROOM THEMES -->

    <div class="category-title">
        Room Themes
    </div>

    <div class="category-scroll">

        <div class="category"
             onclick="filterTheme('All')">
            <div class="category-icon">🌍</div>
            <div class="category-name">Global</div>
        </div>

        <div class="category"
             onclick="filterTheme('Music')">
            <div class="category-icon">🎤</div>
            <div class="category-name">Music</div>
        </div>

        <div class="category"
             onclick="filterTheme('Game')">
            <div class="category-icon">🎮</div>
            <div class="category-name">Game</div>
        </div>

        <div class="category"
             onclick="filterTheme('Party')">
            <div class="category-icon">🎉</div>
            <div class="category-name">Party</div>
        </div>

        <div class="category"
             onclick="filterTheme('Friends')">
            <div class="category-icon">👥</div>
            <div class="category-name">Friends</div>
        </div>

    </div>


    <div class="list-title"
         id="listTitle">
        Popular Rooms
    </div>

    <div class="rooms"
         id="roomsList">
    </div>

</div>


<!-- =========================
     BOTTOM NAV
========================= -->

<div class="bottom">

    <button class="nav active">
        <span class="nav-icon">⌂</span>
        Home
    </button>

    <button class="nav"
        onclick="showToast('Discover')">
        <span class="nav-icon">🌐</span>
        Discover
    </button>

    <button class="nav"
        onclick="showToast('Voice')">
        <span class="nav-icon">🎙</span>
        Voice
    </button>

    <button class="nav"
        onclick="showToast('Messages')">
        <span class="nav-icon">💬</span>
        Message
    </button>

    <button class="nav"
        onclick="showToast('Profile')">
        <span class="nav-icon">👤</span>
        Profile
    </button>

</div>


<!-- =========================
     SEARCH
========================= -->

<div class="search-page"
     id="searchPage">

    <div class="search-top">

        <button class="search-back"
            onclick="closeSearch()">
            ‹
        </button>

        <input
            id="searchInput"
            class="search-input"
            placeholder="Search room or ID..."
            oninput="searchRooms()"
        >

    </div>

    <div class="search-results">

        <div class="rooms"
             id="searchResults">
        </div>

    </div>

</div>


<!-- =========================
     VOICE ROOM
========================= -->

<div class="room-page"
     id="roomPage">

    <div class="room-header">

        <button class="room-back"
            onclick="leaveRoom()">
            ‹
        </button>

        <div class="room-header-info">

            <div class="room-header-name"
                 id="roomName">
                Room
            </div>

            <div class="room-header-id"
                 id="roomId">
                ID: MR00000
            </div>

        </div>

        <button class="room-header-btn"
            onclick="followCurrent()"
            id="followBtn">
            ♡
        </button>

        <button class="room-header-btn"
            onclick="showToast('Room settings')">
            ⋮
        </button>

    </div>


    <div class="room-announcement">
        🎉 Welcome to MR voice room
    </div>


    <div class="host">

        <div class="host-avatar">
            👑
        </div>

        <div class="host-name"
             id="hostName">
            Room Owner
        </div>

        <div class="host-tag">
            HOST
        </div>

    </div>


    <div class="seats"
         id="seats">
    </div>


    <div class="chat"
         id="chat">

        <div class="chat-line">
            <b>System:</b>
            Welcome to the room.
        </div>

    </div>


    <!-- GIFT PANEL -->

    <div class="gift-panel"
         id="giftPanel">

        <div class="gifts">

            <button class="gift"
                onclick="sendGift('🌹')">
                <div>🌹</div>
                <small>Rose</small>
            </button>

            <button class="gift"
                onclick="sendGift('❤️')">
                <div>❤️</div>
                <small>Love</small>
            </button>

            <button class="gift"
                onclick="sendGift('🚀')">
                <div>🚀</div>
                <small>Rocket</small>
            </button>

            <button class="gift"
                onclick="sendGift('🎁')">
                <div>🎁</div>
                <small>Gift</small>
            </button>

        </div>

    </div>


    <div class="room-footer">

        <button
            class="room-action on"
            id="micBtn"
            onclick="toggleMic()">
            🎙
        </button>

        <input
            class="room-input"
            id="messageInput"
            placeholder="Say something..."
            onkeydown="sendMessage(event)"
        >

        <button
            class="room-action"
            onclick="toggleGift()">
            🎁
        </button>

        <button
            class="room-action"
            onclick="showToast('More')">
            ⋯
        </button>

    </div>

</div>


<div class="toast"
     id="toast">
</div>


<script>

/* ==========================================
   POPULAR ROOMS
========================================== */

const popularRooms = [

    {
        id:"MR10001",
        name:"RAKOB+FULL",
        owner:"RAKOB+FULL",
        country:"🇲🇾",
        users:16,
        theme:"Party",
        avatar:"🚀"
    },

    {
        id:"MR10002",
        name:"মানুষ বড় বেইমান",
        owner:"মানুষ বড় বেইমান",
        country:"🇧🇩",
        users:19,
        theme:"Friends",
        avatar:"❤️"
    },

    {
        id:"MR10003",
        name:"ভালোবাসার মানুষ",
        owner:"Ms Asif",
        country:"🇧🇩",
        users:4,
        theme:"Friends",
        avatar:"💖"
    },

    {
        id:"MR10004",
        name:"IMRAN SK",
        owner:"Imran SK",
        country:"🇮🇳",
        users:4,
        theme:"Music",
        avatar:"🎤"
    },

    {
        id:"MR10005",
        name:"MR Hridoy",
        owner:"MR Hridoy",
        country:"🇦🇪",
        users:2,
        theme:"Friends",
        avatar:"😎"
    },

    {
        id:"MR10006",
        name:"প্রেম নগর হাইস",
        owner:"Mafiya",
        country:"🇸🇦",
        users:6,
        theme:"Party",
        avatar:"💗"
    },

    {
        id:"MR10007",
        name:"সবাই আসুন",
        owner:"New World",
        country:"🇧🇩",
        users:8,
        theme:"Global",
        avatar:"🎁"
    },

    {
        id:"MR10008",
        name:"Feel Room",
        owner:"Feel",
        country:"🇦🇪",
        users:12,
        theme:"Music",
        avatar:"🎵"
    }

];


/* ==========================================
   USER DATA
========================================== */

let following =
    JSON.parse(
        localStorage.getItem("MR_following") || "[]"
    );

let recent =
    JSON.parse(
        localStorage.getItem("MR_recent") || "[]"
    );

let currentRoom = null;
let currentTab = "popular";


/* ==========================================
   STORAGE
========================================== */

function saveData(){

    localStorage.setItem(
        "MR_following",
        JSON.stringify(following)
    );

    localStorage.setItem(
        "MR_recent",
        JSON.stringify(recent)
    );

}


/* ==========================================
   ALL ROOMS
========================================== */

function allRooms(){

    const map = new Map();

    [...popularRooms,...following,...recent]
        .forEach(room=>{
            map.set(room.id,room);
        });

    return [...map.values()];

}


function findRoom(id){

    return allRooms()
        .find(room=>room.id===id);

}


/* ==========================================
   TAB
========================================== */

function setTab(tab,button){

    currentTab=tab;

    document
        .querySelectorAll(".tab")
        .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    if(tab==="following"){
        document.getElementById("listTitle")
            .innerText="Following Rooms";
    }

    if(tab==="popular"){
        document.getElementById("listTitle")
            .innerText="Popular Rooms";
    }

    if(tab==="recent"){
        document.getElementById("listTitle")
            .innerText="Recent Rooms";
    }

    renderRooms();

}


/* ==========================================
   ROOM DATA FOR TAB
========================================== */

function roomsForTab(){

    if(currentTab==="following")
        return following;

    if(currentTab==="recent")
        return recent;

    return popularRooms;

}


/* ==========================================
   RENDER
========================================== */

function renderRooms(){

    const list =
        document.getElementById("roomsList");

    list.innerHTML="";

    const rooms=roomsForTab();

    if(rooms.length===0){

        list.innerHTML=`

            <div class="empty">

                <div class="empty-icon">
                    ${currentTab==="following" ? "♡" : "🕘"}
                </div>

                <h3>
                    ${
                        currentTab==="following"
                        ? "No Following Rooms"
                        : "No Recent Rooms"
                    }
                </h3>

                <p>
                    ${
                        currentTab==="following"
                        ? "Follow rooms and they will appear here."
                        : "Rooms you enter will appear here."
                    }
                </p>

            </div>

        `;

        return;
    }

    rooms.forEach(room=>{
        list.appendChild(
            makeRoomCard(room)
        );
    });

}


/* ==========================================
   ROOM CARD
========================================== */

function makeRoomCard(room){

    const div=document.createElement("div");

    div.className="room";

    div.onclick=()=>{
        enterRoom(room.id);
    };

    div.innerHTML=`

        <div class="room-cover">
            ${room.avatar || "🎙"}
        </div>

        <div class="room-info">

            <div class="room-name">
                ${room.name}
            </div>

            <div class="room-owner">
                ${room.country} ${room.owner}
            </div>

            <div class="room-meta">
                🎙 Voice Room · ${room.theme}
            </div>

        </div>

        <div class="room-users">
            <strong>
                ${room.users}
            </strong>
            👥
        </div>

    `;

    return div;

}


/* ==========================================
   ENTER ROOM
========================================== */

function enterRoom(id){

    const room=findRoom(id);

    if(!room) return;

    currentRoom=room;

    /* Remove duplicate */
    recent=
        recent.filter(x=>x.id!==room.id);

    /* Put visited room first */
    recent.unshift(room);

    /* Keep last 20 */
    recent=recent.slice(0,20);

    saveData();

    openRoom(room);

}


/* ==========================================
   OPEN ROOM
========================================== */

function openRoom(room){

    document.getElementById("roomName")
        .innerText=room.name;

    document.getElementById("roomId")
        .innerText=
        "ID: "+room.id+
        "  •  👥 "+room.users;

    document.getElementById("hostName")
        .innerText=room.owner;

    createSeats(room);

    updateFollowButton();

    document.getElementById("roomPage")
        .classList.add("show");

}


/* ==========================================
   SEATS
========================================== */

function createSeats(room){

    const box=
        document.getElementById("seats");

    box.innerHTML="";

    const users=[
        room.owner,
        "Rasel",
        "Friend",
        "Love",
        "User 01",
        "User 02",
        "Guest",
        "New User"
    ];

    const faces=[
        "👑",
        "😊",
        "😎",
        "🥰",
        "🤗",
        "🙂",
        "🙋",
        "👤"
    ];

    users.forEach((name,index)=>{

        const seat=
            document.createElement("div");

        seat.className="seat";

        seat.innerHTML=`

            <div class="seat-avatar">

                ${faces[index]}

                <span class="seat-mic">
                    🎙
                </span>

            </div>

            <div class="seat-name">
                ${name}
            </div>

        `;

        box.appendChild(seat);

    });

}


/* ==========================================
   FOLLOW
========================================== */

function isFollowing(id){

    return following
        .some(room=>room.id===id);

}


function followCurrent(){

    if(!currentRoom) return;

    if(isFollowing(currentRoom.id)){

        following=
            following.filter(
                room=>room.id!==currentRoom.id
            );

        showToast("Unfollowed");

    }else{

        following.unshift(currentRoom);

        showToast("Following");

    }

    saveData();

    updateFollowButton();

    if(currentTab==="following")
        renderRooms();

}


function updateFollowButton(){

    const btn=
        document.getElementById("followBtn");

    if(!currentRoom) return;

    btn.innerText=
        isFollowing(currentRoom.id)
        ? "♥"
        : "♡";

}


/* ==========================================
   LEAVE
========================================== */

function leaveRoom(){

    document.getElementById("roomPage")
        .classList.remove("show");

    currentRoom=null;

    renderRooms();

}


/* ==========================================
   SEARCH
========================================== */

function openSearch(){

    document.getElementById("searchPage")
        .classList.add("show");

    document.getElementById("searchInput")
        .focus();

    searchRooms();

}


function closeSearch(){

    document.getElementById("searchPage")
        .classList.remove("show");

}


function searchRooms(){

    const text=
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const result=
        document.getElementById("searchResults");

    result.innerHTML="";

    const found=
        allRooms().filter(room=>
            room.name.toLowerCase().includes(text) ||
            room.id.toLowerCase().includes(text) ||
            room.owner.toLowerCase().includes(text)
        );

    if(found.length===0){

        result.innerHTML=`

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>No Room Found</h3>

                <p>
                    Search by room name or ID.
                </p>

            </div>

        `;

        return;

    }

    found.forEach(room=>{
        result.appendChild(
            makeRoomCard(room)
        );
    });

}


/* ==========================================
   CREATE ROOM
========================================== */

function createRoom(){

    const name=
        prompt("Enter room name");

    if(!name) return;

    const newRoom={

        id:
            "MR"+
            Math.floor(
                100000+
                Math.random()*899999
            ),

        name:name,

        owner:"Rasel",

        country:"🌍",

        users:1,

        theme:"Friends",

        avatar:"🎙"

    };

    currentRoom=newRoom;

    /* New room does not enter
       Popular or Following automatically */

    recent=
        recent.filter(
            room=>room.id!==newRoom.id
        );

    recent.unshift(newRoom);

    recent=recent.slice(0,20);

    saveData();

    openRoom(newRoom);

}


/* ==========================================
   THEME FILTER
========================================== */

function filterTheme(theme){

    if(theme==="All"){

        currentTab="popular";

        renderRooms();

        return;
    }

    const rooms=
        popularRooms.filter(
            room=>room.theme===theme
        );

    const list=
        document.getElementById("roomsList");

    list.innerHTML="";

    document.getElementById("listTitle")
        .innerText=theme+" Rooms";

    rooms.forEach(room=>{
        list.appendChild(
            makeRoomCard(room)
        );
    });

}


/* ==========================================
   MIC
========================================== */

let mic=true;

function toggleMic(){

    mic=!mic;

    const btn=
        document.getElementById("micBtn");

    if(mic){

        btn.innerText="🎙";
        btn.classList.add("on");

        addChat(
            "System",
            "Microphone ON"
        );

    }else{

        btn.innerText="🔇";
        btn.classList.remove("on");

        addChat(
            "System",
            "Microphone OFF"
        );

    }

}


/* ==========================================
   CHAT
========================================== */

function sendMessage(event){

    if(event.key!=="Enter")
        return;

    const input=
        document.getElementById("messageInput");

    const msg=
        input.value.trim();

    if(!msg)
        return;

    addChat("Rasel",msg);

    input.value="";

}


function addChat(name,message){

    const chat=
        document.getElementById("chat");

    const line=
        document.createElement("div");

    line.className="chat-line";

    line.innerHTML=
        "<b>"+name+":</b> "+message;

    chat.appendChild(line);

    chat.scrollTop=chat.scrollHeight;

}


/* ==========================================
   GIFTS
========================================== */

function toggleGift(){

    document.getElementById("giftPanel")
        .classList.toggle("show");

}


function sendGift(gift){

    document.getElementById("giftPanel")
        .classList.remove("show");

    addChat(
        "Rasel",
        "sent "+gift+" gift"
    );

    showToast(
        "Gift sent "+gift
    );

}


/* ==========================================
   TOAST
========================================== */

function showToast(message){

    const toast=
        document.getElementById("toast");

    toast.innerText=message;

    toast.style.display="block";

    clearTimeout(window.toastTimer);

    window.toastTimer=
        setTimeout(()=>{
            toast.style.display="none";
        },1800);

}


/* ==========================================
   BANNER
========================================== */

let bannerIndex=0;

setInterval(()=>{

    const dots=
        document.querySelectorAll(".banner-dot");

    dots.forEach(dot=>{
        dot.classList.remove("active");
    });

    bannerIndex=
        (bannerIndex+1)%dots.length;

    dots[bannerIndex]
        .classList.add("active");

},3000);


/* ==========================================
   START
========================================== */

renderRooms();

</script>

</body>
</html>
