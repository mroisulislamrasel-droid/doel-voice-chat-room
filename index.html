<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MrChat</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #222;
}

.app {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  margin: auto;
  background: #fff;
  position: relative;
  overflow: hidden;
}

/* =========================
   TOP BAR
========================= */

.top-bar {
  height: 68px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 9px;
  border-bottom: 1px solid #eeeeee;
  background: #ffffff;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

/* TABS */
.tabs {
  height: 42px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px;
  background: #f2f3f5;
  border-radius: 13px;
  flex: 1;
  min-width: 0;
}

.tab {
  height: 36px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 7px;

  border-radius: 10px;
  color: #777;
  font-size: 12px;
  font-weight: 600;

  white-space: nowrap;
  cursor: pointer;
}

.tab.active {
  background: #ffffff;
  color: #222;
  box-shadow: 0 1px 5px rgba(0,0,0,0.10);
}

/* SEARCH */
.search {
  width: 39px;
  height: 39px;
  flex-shrink: 0;

  border: none;
  border-radius: 11px;

  background: #f1f2f4;
  color: #333;

  font-size: 21px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

/* CREATE ROOM */
.create-room {
  width: 39px;
  height: 39px;
  flex-shrink: 0;

  border: none;
  border-radius: 11px;

  background: #222;
  color: #fff;

  font-size: 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

/* =========================
   ROOM AREA
========================= */

.room-area {
  padding: 16px;
  padding-right: 70px;
  padding-bottom: 80px;
}

.room {
  background: #f8f8f8;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 12px;
  border: 1px solid #eeeeee;
}

.room-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 7px;
}

.room-info {
  font-size: 12px;
  color: #777;
}

/* =========================
   RIGHT FOUR OPTIONS
========================= */

.right-options {
  position: absolute;
  right: 10px;
  top: 145px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;

  z-index: 20;
}

.right-options button {
  width: 44px;
  height: 44px;

  border: none;
  border-radius: 50%;

  background: #fff;

  box-shadow: 0 2px 9px rgba(0,0,0,.13);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 19px;
  cursor: pointer;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;

  height: 64px;

  background: #fff;
  border-top: 1px solid #eee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  z-index: 30;
}

.nav-item {
  text-align: center;
  font-size: 11px;
  color: #777;
}

.nav-icon {
  font-size: 20px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #222;
  font-weight: 700;
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="top-bar">

    <div class="logo">MrChat</div>

    <!-- FOLLOWING / POPULAR / RECENT -->
    <div class="tabs">

      <div class="tab active">
        Following
      </div>

      <div class="tab">
        Popular
      </div>

      <div class="tab">
        Recent
      </div>

    </div>

    <!-- SEARCH -->
    <button class="search">
      ⌕
    </button>

    <!-- CREATE ROOM -->
    <button class="create-room">
      ＋
    </button>

  </div>


  <!-- ROOMS -->
  <div class="room-area">

    <div class="room">
      <div class="room-title">
        🎙️ Friendly Chat Room
      </div>
      <div class="room-info">
        24 people are chatting
      </div>
    </div>

    <div class="room">
      <div class="room-title">
        🌎 International Room
      </div>
      <div class="room-info">
        56 people are chatting
      </div>
    </div>

    <div class="room">
      <div class="room-title">
        🎵 Music & Friends
      </div>
      <div class="room-info">
        18 people are chatting
      </div>
    </div>

    <div class="room">
      <div class="room-title">
        💬 Bangla Voice Room
      </div>
      <div class="room-info">
        32 people are chatting
      </div>
    </div>

  </div>


  <!-- RIGHT SIDE FOUR OPTIONS -->
  <div class="right-options">

    <button>♡</button>
    <button>🎁</button>
    <button>↗</button>
    <button>⋮</button>

  </div>


  <!-- BOTTOM NAV -->
  <div class="bottom-nav">

    <div class="nav-item active">
      <div class="nav-icon">⌂</div>
      Home
    </div>

    <div class="nav-item">
      <div class="nav-icon">🎙</div>
      Rooms
    </div>

    <div class="nav-item">
      <div class="nav-icon">🔔</div>
      Notifications
    </div>

    <div class="nav-item">
      <div class="nav-icon">👤</div>
      Profile
    </div>

  </div>

</div>

</body>
</html>
