<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>MR</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f7fa;
    color:#222;
}

button{
    border:0;
    background:none;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    padding-bottom:80px;
}


/* =========================
   TOP BAR
========================= */

.top{
    height:58px;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:14px;
    background:#fff;
    position:sticky;
    top:0;
    z-index:50;
}

.tabs{
    display:flex;
    align-items:center;
    gap:17px;
    flex:1;
}

.tab{
    font-size:14px;
    color:#777;
    font-weight:600;
    padding:18px 0;
    position:relative;
    white-space:nowrap;
}

.tab.active{
    color:#222;
}

.tab.active:after{
    content:"";
    position:absolute;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    width:20px;
    height:3px;
    border-radius:10px;
    background:#ff4c86;
}


/* SEARCH */

.search-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}


/* CREATE ROOM ICON */

.create-room-btn{
    width:30px;
    height:30px;
    border:2px solid #555;
    border-radius:8px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.create-room-btn:before{
    content:"";
    position:absolute;
    top:-5px;
    left:7px;
    width:12px;
    height:6px;
    border:2px solid #555;
    border-bottom:0;
    border-radius:5px 5px 0 0;
}

.create-room-btn span{
    font-size:18px;
    line-height:1;
    font-weight:bold;
}


/* =========================
   CELEBRATION / EVENT
========================= */

.celebration{
    margin:6px 12px 14px;
    height:140px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    background:
      linear-gradient(110deg,
      #ff4f91,
      #ff7b72,
      #ffc04d);
}

.celebration-content{
    padding:20px;
    color:white;
}

.celebration-small{
    font-size:11px;
    margin-bottom:6px;
    opacity:.9;
}

.celebration-title{
    font-size:25px;
    font-weight:800;
}

.celebration-text{
    margin-top:7px;
    font-size:12px;
}

.celebration-btn{
    margin-top:12px;
    background:white;
    color:#ff4f86;
    padding:7px 15px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}


/* =========================
   RANKING
========================= */

.rank-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    padding:0 12px 16px;
}

.rank{
    background:#fff5f8;
    border-radius:13px;
    padding:12px 5px;
    text-align:center;
}

.rank-icon{
    font-size:23px;
}

.rank-title{
    margin-top:4px;
    font-size:11px;
    font-weight:bold;
}

.rank-sub{
    margin-top:2px;
    font-size:9px;
    color:#999;
}


/* =========================
   ROOM SECTION
========================= */

.section{
    padding:0 12px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.section-title{
    font-size:17px;
    font-weight:800;
}


/* =========================
   ROOM LIST
========================= */

.rooms{
    display:flex;
    flex-direction:column;
    gap:9px;
}


/* ROOM CARD */

.room{
    display:flex;
    align-items:center;
    padding:9px;
    border-radius:13px;
    background:#fff;
    border:1px solid #eeeeee;
    box-shadow:0 2px 9px rgba(0,0,0,.035);
    cursor:pointer;
}


/* ছোট গোল ছবি */

.room-avatar{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
    border:2px solid #fff;
    box-shadow:0 1px 5px rgba(0,0,0,.12);
}


.room-info{
    min-width:0;
    flex:1;
    margin-left:10px;
}

.room-name{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.room-id{
    font-size:9px;
    color:#aaa;
    margin-top:3px;
}

.room-owner{
    font-size:10px;
    color:#777;
    margin-top:4px;
}

.room-bottom{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
}

.country{
    font-size:12px;
}

.users{
    color:#999;
    font-size:9px;
}


/* right side */

.room-right{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.gift{
    font-size:20px;
}

.follow-btn{
    padding:4px 9px;
    border-radius:15px;
    border:1px solid #ff4f86;
    color:#ff4f86;
    font-size:9px;
}

.follow-btn.followed{
    color:white;
    background:#ff4f86;
}


/* EMPTY */

.empty{
    text-align:center;
    padding:45px 10px;
    color:#aaa;
}

.empty-icon{
    font-size:38px;
    margin-bottom:8px;
}

.empty-text{
    font-size:13px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:520px;
    height:70px;
    background:#fff;
    border-top:1px solid #eee;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
}

.bottom-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    color:#999;
    font-size:9px;
}

.bottom-item.active{
    color:#ff4f86;
}

.bottom-icon{
    font-size:21px;
}


/* =========================
   SEARCH
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
}

.overlay.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:520px;
    max-height:85vh;
    overflow:auto;
    background:#fff;
    border-radius:22px 22px 0 0;
    padding:18px;
}

.sheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.sheet-title{
    font-size:18px;
    font-weight:800;
}

.close{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#f2f2f2;
    font-size:19px;
}

.search-box{
    background:#f5f5f7;
    border-radius:13px;
    display:flex;
    align-items:center;
    padding:10px 12px;
    gap:8px;
}

.search-box input{
    border:0;
    outline:none;
    background:none;
    width:100%;
    font-size:13px;
}

.search-result{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.search-result img{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
}

.search-info{
    flex:1;
}

.search-name{
    font-size:13px;
    font-weight:bold;
}

.search-id{
    font-size:9px;
    color:#999;
    margin-top:3px;
}


/* =========================
   ROOM SCREEN
========================= */

.room-screen{
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 10%,
      #5a3978,
      #191725 45%,
      #0d0d13);
    color:white;
    display:none;
    z-index:500;
}

.room-screen.show{
    display:block;
}

.room-top{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
}

.room-top-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.back{
    color:white;
    font-size:30px;
}

.live-title{
    font-size:14px;
    font-weight:bold;
}

.live-users{
    font-size:9px;
    color:#aaa;
    margin-top:2px;
}

.room-content{
    padding:10px 14px;
}

.host{
    display:flex;
    align-items:center;
    gap:9px;
}

.host img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ff72a3;
}

.host-name{
    font-size:13px;
    font-weight:bold;
}

.host-id{
    color:#aaa;
    font-size:9px;
    margin-top:3px;
}

.seats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px 7px;
    margin-top:30px;
}

.seat{
    text-align:center;
}

.seat-avatar{
    width:50px;
    height:50px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    background:#29273a;
}

.seat-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.seat-name{
    font-size:8px;
    color:#ddd;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.room-controls{
    position:absolute;
    bottom:20px;
    left:14px;
    right:14px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.control{
    height:46px;
    border-radius:25px;
    background:rgba(255,255,255,.13);
    color:white;
    font-size:20px;
}

.control.on{
    background:#ff4f86;
}


/* toast */

#toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.82);
    color:white;
    padding:9px 15px;
    border-radius:20px;
    font-size:11px;
    z-index:9999;
    display:none;
}

</style>
</head>


<body>

<div class="app">


<!-- =================================
     TOP
================================= -->

<div class="top">

    <!-- FOLLOWING FIRST -->

    <div class="tabs">

        <button
            class="tab"
            onclick="changeTab('following',this)">
            Following
        </button>

        <button
            class="tab active"
            onclick="changeTab('popular',this)">
            Popular
        </button>

        <button
            class="tab"
            onclick="changeTab('recent',this)">
            Recent
        </button>

    </div>


    <!-- SEARCH -->

    <button
        class="search-btn"
        onclick="openSearch()">
        🔍
    </button>


    <!-- CREATE ROOM -->

    <button
        class="create-room-btn"
        onclick="openCreate()">

        <span>+</span>

    </button>

</div>



<!-- =================================
     CELEBRATION
================================= -->

<div class="celebration">

    <div class="celebration-content">

        <div class="celebration-small">
            MR SPECIAL EVENT
        </div>

        <div class="celebration-title">
            Celebration
        </div>

        <div class="celebration-text">
            Talk • Sing • Play • Make Friends
        </div>

        <button
            class="celebration-btn"
            onclick="toast('Welcome to MR')">

            Join Now

        </button>

    </div>

</div>



<!-- =================================
     RANKING
================================= -->

<div class="rank-grid">

    <button class="rank"
            onclick="toast('Contribution Ranking')">

        <div class="rank-icon">🏆</div>

        <div class="rank-title">
            Contribution
        </div>

        <div class="rank-sub">
            Ranking
        </div>

    </button>


    <button class="rank"
            onclick="toast('Charm Ranking')">

        <div class="rank-icon">💎</div>

        <div class="rank-title">
            Charm Ranking
        </div>

        <div class="rank-sub">
            Ranking
        </div>

    </button>


    <button class="rank"
            onclick="toast('Room Ranking')">

        <div class="rank-icon">👑</div>

        <div class="rank-title">
            Room Ranking
        </div>

        <div class="rank-sub">
            Ranking
        </div>

    </button>

</div>



<!-- =================================
     ROOM LIST
================================= -->

<section class="section">

    <div class="section-head">

        <div
            class="section-title"
            id="sectionTitle">
            Popular Rooms
        </div>

    </div>


    <div
        class="rooms"
        id="rooms">
    </div>

</section>

</div>



<!-- =================================
     BOTTOM
================================= -->

<div class="bottom">

    <button
        class="bottom-item active"
        onclick="setBottom(this)">

        <div class="bottom-icon">⌂</div>
        <div>Home</div>

    </button>


    <button
        class="bottom-item"
        onclick="toast('Discover')">

        <div class="bottom-icon">◎</div>
        <div>Discover</div>

    </button>


    <button
        class="bottom-item"
        onclick="openCreate()">

        <div class="bottom-icon">🎙</div>
        <div>Voice</div>

    </button>


    <button
        class="bottom-item"
        onclick="toast('Messages')">

        <div class="bottom-icon">💬</div>
        <div>Message</div>

    </button>


    <button
        class="bottom-item"
        onclick="toast('Profile')">

        <div class="bottom-icon">👤</div>
        <div>Profile</div>

    </button>

</div>



<!-- =================================
     SEARCH MODAL
================================= -->

<div
    class="overlay"
    id="searchOverlay">

    <div class="sheet">

        <div class="sheet-head">

            <div class="sheet-title">
                Search Room
            </div>

            <button
                class="close"
                onclick="closeSearch()">
                ×
            </button>

        </div>


        <div class="search-box">

            🔍

            <input
                id="searchInput"
                placeholder="Room name / ID"
                oninput="searchRooms(this.value)"
            >

        </div>


        <div id="searchResults"></div>

    </div>

</div>



<!-- =================================
     CREATE ROOM
================================= -->

<div
    class="overlay"
    id="createOverlay">

    <div class="sheet">

        <div class="sheet-head">

            <div class="sheet-title">
                Create Room
            </div>

            <button
                class="close"
                onclick="closeCreate()">
                ×
            </button>

        </div>


        <div class="rank-grid">

            <button
                class="rank"
                onclick="createRoom('Voice Room')">

                <div class="rank-icon">🎙</div>
                <div class="rank-title">Voice Room</div>

            </button>


            <button
                class="rank"
                onclick="createRoom('Music Room')">

                <div class="rank-icon">🎵</div>
                <div class="rank-title">Music Room</div>

            </button>


            <button
                class="rank"
                onclick="createRoom('Game Room')">

                <div class="rank-icon">🎮</div>
                <div class="rank-title">Game Room</div>

            </button>


            <button
                class="rank"
                onclick="createRoom('Party Room')">

                <div class="rank-icon">🎉</div>
                <div class="rank-title">Party Room</div>

            </button>

        </div>

    </div>

</div>



<!-- =================================
     ROOM SCREEN
================================= -->

<div
    class="room-screen"
    id="roomScreen">


    <div class="room-top">

        <div class="room-top-left">

            <button
                class="back"
                onclick="leaveRoom()">
                ‹
            </button>

            <div>

                <div
                    class="live-title"
                    id="liveTitle">
                    MR Room
                </div>

                <div
                    class="live-users"
                    id="liveUsers">
                    0 people
                </div>

            </div>

        </div>

        <div>⋮</div>

    </div>


    <div class="room-content">

        <div class="host">

            <img
                id="hostPhoto"
                src=""
            >

            <div>

                <div
                    class="host-name"
                    id="hostName">
                </div>

                <div
                    class="host-id"
                    id="hostId">
                </div>

            </div>

        </div>


        <div
            class="seats"
            id="seats">
        </div>

    </div>


    <div class="room-controls">

        <button
            class="control"
            id="mic"
            onclick="toggleMic()">
            🎙
        </button>

        <button
            class="control"
            onclick="toast('Chat')">
            💬
        </button>

        <button
            class="control"
            onclick="toast('Gift')">
            🎁
        </button>

        <button
            class="control"
            onclick="leaveRoom()">
            🚪
        </button>

    </div>

</div>



<div id="toast"></div>



<script>

/* ============================================
   POPULAR
   শুধুমাত্র এই room-গুলো Popular-এ থাকবে
============================================ */

const popularRooms = [

{
    id:"MR10001",
    owner:"RAKOB+FULL",
    name:"RAKOB+FULL",
    country:"🇲🇾",
    users:16,
    photo:"https://i.pravatar.cc/150?img=12",
    gift:"🚀"
},

{
    id:"MR10002",
    owner:"মানুষ বড় বেইমান",
    name:"মানুষ বড় বেইমান",
    country:"🇧🇩",
    users:19,
    photo:"https://i.pravatar.cc/150?img=32",
    gift:"🚀"
},

{
    id:"MR10003",
    owner:"Ms Asif",
    name:"ভালোবাসার মানুষ",
    country:"🇧🇩",
    users:4,
    photo:"https://i.pravatar.cc/150?img=47",
    gift:"🚀"
},

{
    id:"MR10004",
    owner:"Imran SK",
    name:"IMRAN SK",
    country:"🇮🇳",
    users:4,
    photo:"https://i.pravatar.cc/150?img=51",
    gift:"🚀"
},

{
    id:"MR10005",
    owner:"MR Hridoy",
    name:"MR Hridoy",
    country:"🇦🇪",
    users:2,
    photo:"https://i.pravatar.cc/150?img=13",
    gift:"🚀"
},

{
    id:"MR10006",
    owner:"Mafiya",
    name:"প্রেম নগর হাইস",
    country:"🇸🇦",
    users:6,
    photo:"https://i.pravatar.cc/150?img=44",
    gift:"🚀"
},

{
    id:"MR10007",
    owner:"New World",
    name:"সবাই আসুন",
    country:"🇧🇩",
    users:8,
    photo:"https://i.pravatar.cc/150?img=25",
    gift:"🎁"
},

{
    id:"MR10008",
    owner:"Feel",
    name:"Feel Room",
    country:"🇦🇪",
    users:12,
    photo:"https://i.pravatar.cc/150?img=36",
    gift:"🚀"
}

];


/* ============================================
   FOLLOWING
   শুরুতে EMPTY
============================================ */

let followingIds =
    JSON.parse(
        localStorage.getItem("MR_following") || "[]"
    );


/* ============================================
   RECENT
   শুরুতে EMPTY
============================================ */

let recentIds =
    JSON.parse(
        localStorage.getItem("MR_recent") || "[]"
    );


let currentTab = "popular";
let currentRoom = null;


/* ============================================
   FIND POPULAR ROOM
============================================ */

function findRoom(id){

    return popularRooms.find(
        room => room.id === id
    );

}


/* ============================================
   FOLLOWING ROOMS
============================================ */

function getFollowing(){

    return followingIds
        .map(id => findRoom(id))
        .filter(Boolean);

}


/* ============================================
   RECENT ROOMS
============================================ */

function getRecent(){

    return recentIds
        .map(id => findRoom(id))
        .filter(Boolean);

}


/* ============================================
   CHANGE TAB
============================================ */

function changeTab(tab,button){

    currentTab = tab;

    document
        .querySelectorAll(".tab")
        .forEach(
            x => x.classList.remove("active")
        );

    button.classList.add("active");

    render();

}


/* ============================================
   RENDER
============================================ */

function render(){

    const container =
        document.getElementById("rooms");

    const title =
        document.getElementById("sectionTitle");


    let rooms = [];


    /* POPULAR */

    if(currentTab === "popular"){

        rooms = popularRooms;

        title.innerText =
            "Popular Rooms";

    }


    /* FOLLOWING ONLY */

    if(currentTab === "following"){

        rooms = getFollowing();

        title.innerText =
            "Following";

    }


    /* RECENT ONLY */

    if(currentTab === "recent"){

        rooms = getRecent();

        title.innerText =
            "Recent";

    }


    /* EMPTY */

    if(rooms.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    ${
                        currentTab === "following"
                        ? "♡"
                        : "🕘"
                    }

                </div>

                <div class="empty-text">

                    ${
                        currentTab === "following"
                        ? "কোনো Follow করা room নেই"
                        : "এখনও কোনো room visit করা হয়নি"
                    }

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML =
        rooms.map(roomCard).join("");

}


/* ============================================
   ROOM CARD
============================================ */

function roomCard(room){

    const followed =
        followingIds.includes(room.id);


    return `

        <div
            class="room"
            onclick="enterRoom('${room.id}')">


            <!-- ছোট গোল USER IMAGE -->

            <img
                class="room-avatar"
                src="${room.photo}"
                alt=""
            >


            <div class="room-info">

                <div class="room-name">
                    ${safe(room.name)}
                </div>

                <div class="room-id">
                    ID: ${room.id}
                </div>

                <div class="room-owner">
                    ${safe(room.owner)}
                </div>

                <div class="room-bottom">

                    <span class="country">
                        ${room.country}
                    </span>

                    <span class="users">
                        👥 ${room.users}
                    </span>

                </div>

            </div>


            <div
                class="room-right"
                onclick="event.stopPropagation()">


                <div class="gift">
                    ${room.gift}
                </div>


                <button
                    class="follow-btn
                    ${followed ? "followed" : ""}"
                    onclick="toggleFollow('${room.id}')">

                    ${
                        followed
                        ? "Following"
                        : "Follow"
                    }

                </button>

            </div>

        </div>

    `;

}


/* ============================================
   FOLLOW / UNFOLLOW
============================================ */

function toggleFollow(id){

    if(followingIds.includes(id)){

        followingIds =
            followingIds.filter(
                x => x !== id
            );

        toast("Unfollowed");

    }else{

        followingIds.unshift(id);

        toast("Following");

    }


    localStorage.setItem(
        "MR_following",
        JSON.stringify(followingIds)
    );


    render();

}


/* ============================================
   ENTER ROOM
============================================ */

function enterRoom(id){

    const room = findRoom(id);

    if(!room) return;


    /* পুরোনো duplicate বাদ */

    recentIds =
        recentIds.filter(
            x => x !== id
        );


    /* সর্বশেষ visit সবার উপরে */

    recentIds.unshift(id);


    /* সর্বোচ্চ 30টি */

    recentIds =
        recentIds.slice(0,30);


    localStorage.setItem(
        "MR_recent",
        JSON.stringify(recentIds)
    );


    openRoom(room);

}


/* ============================================
   OPEN ROOM
============================================ */

function openRoom(room){

    currentRoom = room;


    document.getElementById("liveTitle")
        .innerText = room.name;


    document.getElementById("liveUsers")
        .innerText = room.users + " people";


    document.getElementById("hostName")
        .innerText = room.owner;


    document.getElementById("hostId")
        .innerText = room.id;


    document.getElementById("hostPhoto")
        .src = room.photo;


    let seats = "";


    for(let i=0;i<Math.min(room.users,15);i++){

        let image =
            "https://i.pravatar.cc/150?img=" +
            ((i+5)%70+1);


        seats += `

            <div class="seat">

                <div class="seat-avatar">

                    <img
                        src="${image}"
                        alt=""
                    >

                </div>

                <div class="seat-name">

                    ${
                        i === 0
                        ? safe(room.owner)
                        : "User " + (i+1)
                    }

                </div>

            </div>

        `;

    }


    document.getElementById("seats")
        .innerHTML = seats;


    document
        .getElementById("roomScreen")
        .classList.add("show");

}


/* ============================================
   LEAVE
============================================ */

function leaveRoom(){

    document
        .getElementById("roomScreen")
        .classList.remove("show");

    currentRoom = null;

}


/* ============================================
   SEARCH
============================================ */

function openSearch(){

    document
        .getElementById("searchOverlay")
        .classList.add("show");

    document
        .getElementById("searchInput")
        .focus();

    searchRooms("");

}


function closeSearch(){

    document
        .getElementById("searchOverlay")
        .classList.remove("show");

}


function searchRooms(value){

    value =
        value.toLowerCase().trim();


    let rooms = popularRooms;


    if(value){

        rooms =
            rooms.filter(room =>

                room.name
                    .toLowerCase()
                    .includes(value)

                ||

                room.owner
                    .toLowerCase()
                    .includes(value)

                ||

                room.id
                    .toLowerCase()
                    .includes(value)

            );

    }


    const result =
        document.getElementById("searchResults");


    if(!rooms.length){

        result.innerHTML = `
            <div class="empty">
                কোনো room পাওয়া যায়নি
            </div>
        `;

        return;

    }


    result.innerHTML =
        rooms.map(room => `

            <div
                class="search-result"
                onclick="searchEnter('${room.id}')">

                <img
                    src="${room.photo}"
                    alt=""
                >

                <div class="search-info">

                    <div class="search-name">
                        ${safe(room.name)}
                    </div>

                    <div class="search-id">
                        ${room.id}
                    </div>

                </div>

                <div>
                    ${room.country}
                </div>

            </div>

        `).join("");

}


function searchEnter(id){

    closeSearch();

    enterRoom(id);

}


/* ============================================
   CREATE ROOM
============================================ */

function openCreate(){

    document
        .getElementById("createOverlay")
        .classList.add("show");

}


function closeCreate(){

    document
        .getElementById("createOverlay")
        .classList.remove("show");

}


function createRoom(type){

    closeCreate();

    toast(
        type +
        " তৈরি করার server system পরে যুক্ত হবে"
    );

}


/* ============================================
   MIC
============================================ */

let micOn = false;

function toggleMic(){

    micOn = !micOn;

    const mic =
        document.getElementById("mic");


    mic.classList.toggle(
        "on",
        micOn
    );


    toast(
        micOn
        ? "Microphone ON"
        : "Microphone OFF"
    );

}


/* ============================================
   BOTTOM
============================================ */

function setBottom(button){

    document
        .querySelectorAll(".bottom-item")
        .forEach(
            x => x.classList.remove("active")
        );

    button.classList.add("active");

}


/* ============================================
   CREATE / TOAST
============================================ */

function toast(message){

    const box =
        document.getElementById("toast");


    box.innerText = message;

    box.style.display = "block";


    setTimeout(() => {

        box.style.display = "none";

    },1700);

}


/* ============================================
   SAFE TEXT
============================================ */

function safe(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================================
   START
============================================ */

render();

</script>

</body>
</html>
