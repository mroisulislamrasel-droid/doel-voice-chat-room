<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MR Chat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6fa;
  color:#222;
  overflow-x:hidden;
}

button{
  border:0;
  background:none;
  font:inherit;
}

.app{
  width:100%;
  max-width:700px;
  min-height:100vh;
  margin:auto;
  background:#f5f6fa;
  position:relative;
  padding-bottom:86px;
}

/* =========================
   TOP PROFILE AREA
========================= */

.profile-top{
  min-height:465px;
  padding:30px 22px 18px;
  position:relative;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.45),transparent 28%),
    linear-gradient(180deg,#a8eaf0 0%,#d9f7f5 42%,#f5f6fa 100%);
}

.status-space{
  height:55px;
}

.profile-main{
  display:flex;
  align-items:center;
  gap:25px;
  padding:25px 25px 0;
}

.avatar{
  width:126px;
  height:126px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 4px 14px rgba(0,0,0,.12);
}

.profile-info{
  flex:1;
  min-width:0;
}

.profile-name{
  font-size:29px;
  font-weight:700;
  color:#222;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-id{
  margin-top:22px;
  font-size:20px;
  color:#929292;
}

.switch-icon{
  position:absolute;
  right:28px;
  top:215px;
  color:#aaa;
  font-size:29px;
  transform:rotate(90deg);
}

.stats{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:55px;
}

.stat{
  width:145px;
  text-align:center;
}

.stat-number{
  font-size:30px;
  font-weight:700;
}

.stat-label{
  margin-top:8px;
  font-size:21px;
  color:#999;
}

.stat-divider{
  width:1px;
  height:38px;
  background:#ddd;
}

.family-logo{
  width:92px;
  height:92px;
  object-fit:contain;
  margin-left:auto;
}

/* =========================
   WALLET / STORE
========================= */

.wallet-store{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  padding:0 22px;
  margin-top:-2px;
  position:relative;
  z-index:3;
}

.big-card{
  height:128px;
  border-radius:23px;
  padding:27px 28px;
  color:white;
  position:relative;
  overflow:hidden;
}

.big-card:after{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  right:-50px;
  bottom:-75px;
  background:rgba(255,255,255,.10);
  border-radius:50%;
}

.wallet{
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.16),transparent 25%),
    linear-gradient(135deg,#ff6848,#ff9d43);
}

.store{
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.16),transparent 25%),
    linear-gradient(135deg,#43aeea,#59c7ee);
}

.big-title{
  font-size:29px;
  font-weight:400;
  position:relative;
  z-index:2;
}

.coin{
  margin-top:12px;
  font-size:23px;
  position:relative;
  z-index:2;
}

.big-icon{
  position:absolute;
  right:17px;
  top:28px;
  font-size:58px;
  z-index:2;
}

/* =========================
   MENU CARDS
========================= */

.menu-card{
  margin:23px 22px 0;
  background:#fff;
  border-radius:24px;
  overflow:hidden;
}

.menu-row{
  min-height:96px;
  display:flex;
  align-items:center;
  padding:0 30px;
  gap:27px;
}

.menu-icon{
  width:43px;
  text-align:center;
  font-size:35px;
  flex-shrink:0;
}

.menu-title{
  font-size:28px;
  font-weight:400;
  flex:1;
}

.menu-right{
  display:flex;
  align-items:center;
  gap:18px;
}

.badge-img{
  height:36px;
  max-width:105px;
  object-fit:contain;
}

.arrow{
  font-size:36px;
  font-weight:300;
  color:#b8b8b8;
}

/* colored emoji icons */

.gold{color:#ffb300}
.purple{color:#8c6bed}
.pink{color:#f33188}
.blue{color:#28b6e9}
.orange{color:#ff8c00}
.green{color:#4edb72}

/* =========================
   LOWER MENU
========================= */

.lower-card{
  margin-top:23px;
  margin-bottom:20px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:700px;
  height:86px;
  background:rgba(255,255,255,.96);
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:50;
  padding-bottom:7px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#cbd0da;
  font-size:12px;
  gap:5px;
}

.nav-icon{
  font-size:32px;
  line-height:1;
}

.nav-item.active{
  color:#8d8dff;
}

.nav-item.active .nav-icon{
  background:linear-gradient(135deg,#45d8ff,#b451ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:100;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:700px;
  background:#fff;
  border-radius:25px 25px 0 0;
  padding:25px;
  animation:up .25s ease;
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal h2{
  font-size:24px;
  margin-bottom:20px;
}

.input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:13px;
  margin-bottom:13px;
  font-size:16px;
}

.save-btn{
  width:100%;
  padding:15px;
  border-radius:15px;
  background:#6d8cff;
  color:#fff;
  font-size:17px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  background:rgba(30,30,30,.88);
  color:#fff;
  padding:12px 20px;
  border-radius:25px;
  z-index:200;
  display:none;
}

.toast.show{
  display:block;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

  .profile-top{
    min-height:460px;
  }

  .profile-main{
    padding:20px 25px 0;
    gap:20px;
  }

  .avatar{
    width:126px;
    height:126px;
  }

  .profile-name{
    font-size:27px;
  }

  .profile-id{
    font-size:19px;
    margin-top:18px;
  }

  .stats{
    margin-top:50px;
  }

  .stat{
    width:120px;
  }

  .stat-number{
    font-size:29px;
  }

  .stat-label{
    font-size:20px;
  }

  .family-logo{
    width:85px;
    height:85px;
  }

  .big-card{
    height:128px;
    padding:27px 28px;
  }

  .big-title{
    font-size:27px;
  }

  .coin{
    font-size:22px;
  }

  .menu-row{
    min-height:96px;
    padding:0 30px;
    gap:25px;
  }

  .menu-icon{
    font-size:34px;
    width:38px;
  }

  .menu-title{
    font-size:27px;
  }

  .arrow{
    font-size:32px;
  }
}

@media(max-width:380px){

  .profile-main{
    padding-left:18px;
    padding-right:18px;
  }

  .avatar{
    width:105px;
    height:105px;
  }

  .profile-name{
    font-size:23px;
  }

  .profile-id{
    font-size:16px;
  }

  .wallet-store{
    padding:0 15px;
  }

  .menu-card{
    margin-left:15px;
    margin-right:15px;
  }

  .menu-row{
    padding:0 20px;
    gap:18px;
  }

  .menu-title{
    font-size:22px;
  }

  .menu-icon{
    font-size:29px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ================= PROFILE ================= -->
  <section class="profile-top">

    <div class="status-space"></div>

    <div class="profile-main">

      <img
        class="avatar"
        id="profilePhoto"
        src="https://i.pravatar.cc/300?img=12"
        alt="Profile"
      >

      <div class="profile-info">
        <div class="profile-name" id="profileName">
          〰Mia༶❀Vai〰
        </div>

        <div class="profile-id">
          ID:100927248
        </div>
      </div>

    </div>

    <div class="switch-icon">⇄</div>

    <div class="stats">

      <div class="stat">
        <div class="stat-number">15</div>
        <div class="stat-label">Follow</div>
      </div>

      <div class="stat-divider"></div>

      <div class="stat">
        <div class="stat-number">26</div>
        <div class="stat-label">Fans</div>
      </div>

      <img
        class="family-logo"
        src="https://cdn-icons-png.flaticon.com/512/2910/2910768.png"
        alt="Family"
      >

    </div>

  </section>


  <!-- ================= WALLET / STORE ================= -->

  <div class="wallet-store">

    <button class="big-card wallet" onclick="openWallet()">
      <div class="big-title">Wallet</div>
      <div class="coin">🪙 32732</div>
      <div class="big-icon">👛</div>
    </button>

    <button class="big-card store" onclick="openStore()">
      <div class="big-title">Store</div>
      <div class="big-icon">🛍️</div>
    </button>

  </div>


  <!-- ================= MAIN MENU ================= -->

  <div class="menu-card">

    <div class="menu-row" onclick="openItem('Invite get coins')">
      <div class="menu-icon gold">💰</div>
      <div class="menu-title">Invite get coins</div>
      <div class="menu-right">
        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('Love House')">
      <div class="menu-icon purple">⬟</div>
      <div class="menu-title">Love House</div>
      <div class="menu-right">
        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('CP Level')">
      <div class="menu-icon pink">💗</div>
      <div class="menu-title">CP Level</div>
      <div class="menu-right">
        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('Prop Warehouse')">
      <div class="menu-icon blue">👜</div>
      <div class="menu-title">Prop Warehouse</div>
      <div class="menu-right">
        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('Medal')">
      <div class="menu-icon orange">🏅</div>
      <div class="menu-title">Medal</div>
      <div class="menu-right">
        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('Level')">
      <div class="menu-icon green">⬢</div>
      <div class="menu-title">Level</div>

      <div class="menu-right">
        <img
          class="badge-img"
          src="https://dummyimage.com/105x38/7d43d9/ffffff&text=LV.41"
        >
        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('SVIP')">
      <div class="menu-icon purple">▼</div>
      <div class="menu-title">SVIP</div>

      <div class="menu-right">
        <img
          class="badge-img"
          src="https://dummyimage.com/100x36/168c45/ffffff&text=SVIP2"
        >
        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('Aristocracy')">
      <div class="menu-icon gold">♛</div>
      <div class="menu-title">Aristocracy</div>

      <div class="menu-right">
        <div style="font-size:39px;">👑</div>
        <div class="arrow">›</div>
      </div>
    </div>

  </div>


  <!-- ================= LOWER MENU ================= -->

  <div class="menu-card lower-card">

    <div class="menu-row" onclick="openItem('Language')">
      <div class="menu-icon">🌐</div>
      <div class="menu-title">Language</div>
      <div class="arrow">›</div>
    </div>


    <div class="menu-row" onclick="openItem('Customer service')">
      <div class="menu-icon">🎧</div>
      <div class="menu-title">Customer service</div>

      <div class="menu-right">
        <span style="
          border:1px solid #ddd;
          padding:5px 12px;
          border-radius:20px;
          color:#999;
          font-size:16px;
        ">● Offline</span>

        <div class="arrow">›</div>
      </div>
    </div>


    <div class="menu-row" onclick="openItem('Feedback')">
      <div class="menu-icon">💬</div>
      <div class="menu-title">Feedback</div>
      <div class="arrow">›</div>
    </div>


    <div class="menu-row" onclick="openSettings()">
      <div class="menu-icon">⬡</div>
      <div class="menu-title">Settings</div>
      <div class="arrow">›</div>
    </div>

  </div>


  <!-- ================= BOTTOM NAV ================= -->

  <nav class="bottom-nav">

    <button class="nav-item" onclick="navClick('Home')">
      <div class="nav-icon">⌂</div>
    </button>

    <button class="nav-item" onclick="navClick('Discover')">
      <div class="nav-icon">◉</div>
    </button>

    <button class="nav-item" onclick="navClick('Moment')">
      <div class="nav-icon">◖</div>
    </button>

    <button class="nav-item" onclick="navClick('Message')">
      <div class="nav-icon">☁</div>
    </button>

    <button class="nav-item active">
      <div class="nav-icon">◉</div>
    </button>

  </nav>

</div>


<!-- ================= MODAL ================= -->

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">

    <h2 id="modalTitle">MR Chat</h2>

    <div id="modalContent">
      Welcome to MR Chat
    </div>

    <br>

    <button class="save-btn" onclick="closeModal()">
      Close
    </button>

  </div>
</div>


<div class="toast" id="toast"></div>


<script>

function showToast(text){

  const toast=document.getElementById("toast");

  toast.textContent=text;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },1800);

}


function openItem(name){

  document.getElementById("modalTitle").textContent=name;

  document.getElementById("modalContent").innerHTML=
    "<p style='font-size:18px;color:#666;line-height:1.6;'>"+
    name+" section is ready for MR Chat.</p>";

  document.getElementById("modalBg").classList.add("show");

}


function openWallet(){

  document.getElementById("modalTitle").textContent="Wallet";

  document.getElementById("modalContent").innerHTML=`
    <div style="text-align:center;padding:15px;">
      <div style="font-size:60px;">👛</div>
      <div style="font-size:25px;margin-top:10px;">🪙 32732</div>
      <div style="color:#999;margin-top:8px;">
        Your MR Chat Coins
      </div>
    </div>
  `;

  document.getElementById("modalBg").classList.add("show");

}


function openStore(){

  document.getElementById("modalTitle").textContent="Store";

  document.getElementById("modalContent").innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

      <div style="background:#f5f6ff;padding:25px;border-radius:18px;text-align:center;">
        🎁<br>
        <b>Gift Store</b>
      </div>

      <div style="background:#fff5f7;padding:25px;border-radius:18px;text-align:center;">
        💎<br>
        <b>VIP Store</b>
      </div>

    </div>
  `;

  document.getElementById("modalBg").classList.add("show");

}


function openSettings(){

  document.getElementById("modalTitle").textContent="Settings";

  document.getElementById("modalContent").innerHTML=`

    <div style="font-size:18px;line-height:3;">

      👤 Account<br>
      🔔 Notifications<br>
      🔒 Privacy<br>
      🛡️ Security<br>
      🚪 Log out

    </div>

  `;

  document.getElementById("modalBg").classList.add("show");

}


function closeModal(){

  document.getElementById("modalBg").classList.remove("show");

}


function navClick(page){

  if(page==="Home"){
    showToast("Home");
  }

  if(page==="Discover"){
    showToast("Discover");
  }

  if(page==="Moment"){
    showToast("Moment");
  }

  if(page==="Message"){
    showToast("Message");
  }

}


</script>

</body>
</html>
