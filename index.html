<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MrChat</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #222;
}

.app {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  margin: auto;
  background: #fff;
  position: relative;
  overflow: hidden;
}

/* TOP BAR */
.top-bar {
  height: 62px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  border-bottom: 1px solid #eee;
  background: #fff;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  margin-right: 18px;
}

.tabs {
  display: flex;
  gap: 15px;
  align-items: center;
  flex: 1;
}

.tab {
  font-size: 13px;
  color: #777;
  white-space: nowrap;
}

.tab.active {
  color: #222;
  font-weight: bold;
}

/* SEARCH */
.search {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: #f1f2f4;
  font-size: 18px;
}

/* CREATE ROOM */
.create-room {
  width: 38px;
  height: 38px;
  margin-left: 7px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 22px;
}

/* ROOM AREA */
.room-area {
  padding: 16px;
  padding-right: 68px;
}

.room {
  background: #f8f8f8;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 12px;
  border: 1px solid #eee;
}

.room-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 7px;
}

.room-info {
  font-size: 12px;
  color: #777;
}

/* RIGHT FOUR OPTIONS */
/* শুধু এই অংশের অবস্থান পরিবর্তন করা হয়েছে */
.right-options {
  position: absolute;
  right: 10px;
  top: 145px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;

  z-index: 20;
}

.right-options button {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 9px rgba(0,0,0,.13);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 19px;
  cursor: pointer;
}

/* BOTTOM NAV */
.bottom-nav {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 64px;

  background: #fff;
  border-top: 1px solid #eee;

  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-item {
  text-align: center;
  font-size: 11px;
  color: #777;
}

.nav-icon {
  font-size: 20px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #222;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <div class="top-bar">

    <div class="logo">MrChat</div>

    <div class="tabs">
      <div class="tab active">Following</div>
      <div class="tab">Popular</div>
      <div class="tab">Recent</div>
    </div>

    <button class="search">⌕</button>

    <button class="create-room">＋</button>

  </div>


  <!-- ROOMS -->
  <div class="room-area">

    <div class="room">
      <div class="room-title">🎙️ Friendly Chat Room</div>
      <div class="room-info">24 people are chatting</div>
    </div>

    <div class="room">
      <div class="room-title">🌎 International Room</div>
      <div class="room-info">56 people are chatting</div>
    </div>

    <div class="room">
      <div class="room-title">🎵 Music & Friends</div>
      <div class="room-info">18 people are chatting</div>
    </div>

    <div class="room">
      <div class="room-title">💬 Bangla Voice Room</div>
      <div class="room-info">32 people are chatting</div>
    </div>

  </div>


  <!-- FOUR RIGHT-SIDE OPTIONS -->
  <div class="right-options">

    <button title="Favorite">♡</button>

    <button title="Gift">🎁</button>

    <button title="Share">↗</button>

    <button title="More">⋮</button>

  </div>


  <!-- BOTTOM NAV -->
  <div class="bottom-nav">

    <div class="nav-item active">
      <div class="nav-icon">⌂</div>
      Home
    </div>

    <div class="nav-item">
      <div class="nav-icon">🎙</div>
      Rooms
    </div>

    <div class="nav-item">
      <div class="nav-icon">🔔</div>
      Notifications
    </div>

    <div class="nav-item">
      <div class="nav-icon">👤</div>
      Profile
    </div>

  </div>

</div>

</body>
</html>
