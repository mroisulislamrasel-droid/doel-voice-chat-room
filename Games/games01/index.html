
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Shoot</title>
  <link rel="stylesheet" href="game.css">
</head>

<body>

  <div class="game">

    <div class="topbar">
      <div>
        <h1>⚽ Football Shoot</h1>
        <p>Penalty Challenge</p>
      </div>

      <div class="score">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>
    </div>

    <div class="stadium">

      <div class="goal">
        <div class="net"></div>

        <div id="keeper" class="keeper">
          🧤
        </div>
      </div>

      <div id="aim" class="aim"></div>

      <div id="ball" class="ball">
        ⚽
      </div>

    </div>

    <div class="power-area">
      <div class="power-title">POWER</div>

      <div class="power-bar">
        <div id="power" class="power"></div>
      </div>
    </div>

    <div id="message" class="message">
      Choose your power and shoot!
    </div>

    <button id="shootBtn" class="shoot">
      SHOOT ⚽
    </button>

    <button id="resetBtn" class="reset">
      RESET GAME
    </button>

  </div>

  <script src="game.js"></script>

</body>
</html>
